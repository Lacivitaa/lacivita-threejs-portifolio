<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #game {
            width: 100%;
            height: 100%;
        }

        #start-screen {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            background: #fff;

            display: flex;
            align-items: center;
            justify-content: center;

            z-index: 10000;
        }

        #start-button {
            appearance: none;
            border: none;
            outline: none;

            background: transparent;
            color: #000;

            cursor: pointer;
        }

        #modal {
            display: none !important;
        }
    </style>

    <!-- IBM Plex Mono -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    />

    <link
        href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap"
        rel="stylesheet"
    />

    <title>Lacivita — Portfolio</title>
</head>

<body>

    <div id="game"></div>

    <div id="interaction">
        <span class="interaction-text">PRESS</span>
        <span class="interaction-key">E</span>
    </div>

    <div id="start-screen">
        <button id="start-button">
            WELCOME
        </button>
    </div>

    <div id="crosshair">+</div>

    <div id="modal" class="hidden" aria-hidden="true">

        <div id="modal-page">

            <button
                id="modal-close"
                aria-label="Close"
            >
                ×
            </button>

            <div class="modal-header">

               <div
                    id="modal-section-number"
                    class="modal-section-number"
                >
                    01
                </div>

                <div>
                    <div class="modal-kicker">
                        PERSONAL RECORD
                    </div>

                    <h1 id="modal-title">
                        ABOUT ME
                    </h1>
                </div>

            </div>


            <div class="modal-divider"></div>


            <div class="modal-about">

                <div class="modal-portrait">

                    <div class="portrait-frame">

                        <img
                            id="about-portrait"
                            alt="Pixel art portrait"
                        />

                    </div>

                    <div class="portrait-caption">
                        SUBJECT: LACIVITA
                    </div>

                </div>


                <div
                    id="modal-body"
                    class="modal-text"
                ></div>

            </div>


            <div class="modal-footer">

                <span>
                    ERROR 404 / NOT FOUND
                </span>

                <span>
                    DOWNLOADING INFORMATION
                </span>

                <span>
                    ███████░░░░
                </span>

            </div>

        </div>

    </div>

    <script
        type="module"
        src="/src/main.js">
    </script>

</body>
</html>
